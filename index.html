<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Islamic Knowledge Hub</title>
<style>
:root {
  --font-sans: system-ui, -apple-system, sans-serif;
  --font-urdu: 'Jameel Noori Nastaleeq', 'Noto Nastaliq Urdu', 'Nafees Regular', Arial, sans-serif;
  --color-text-primary: #111827;
  --color-text-secondary: #4B5563;
  --color-text-tertiary: #9CA3AF;
  --color-background-primary: #ffffff;
  --color-background-secondary: #F3F4F6;
  --color-background-tertiary: #E5E7EB;
  --color-border-secondary: #D1D5DB;
  --color-border-tertiary: #E5E7EB;
  --border-radius-md: 8px;
  --border-radius-lg: 12px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans); background: #f9fafb; transition: all 0.2s;}

/* RTL Support */
body.rtl { font-family: var(--font-urdu); direction: rtl; text-align: right; }
body.rtl .back-btn { left: auto; right: 0; }
body.rtl .lang-btn { right: auto; left: 0; }
body.rtl .verse-note { border-left: none; border-right: 2px solid #1D9E75; border-radius: var(--border-radius-md) 0 0 var(--border-radius-md); }
body.rtl .alert { border-left: none; border-right: 2px solid #EF9F27; }
body.rtl .alert.success { border-left: none; border-right: 2px solid #1D9E75; }
body.rtl .val-input { text-align: left; }
body.rtl .heir-frac { text-align: left; }
body.rtl .tracker-content { padding-right: 12px; padding-left: 0; }

.wrap{max-width:560px;margin:0 auto;padding:1.5rem 1rem; position: relative;}
.hdr{text-align:center;margin-bottom:1.5rem;position:relative;}
.back-btn{position:absolute;left:0;top:50%;transform:translateY(-50%);background:none;border:none;color:#1D9E75;font-size:14px;cursor:pointer;font-weight:500;display:none;font-family:inherit;}
.back-btn:hover{text-decoration:underline;}\n.lang-btn{position:absolute;right:0;top:50%;transform:translateY(-50%);background:var(--color-background-secondary);border:1px solid var(--color-border-secondary);color:var(--color-text-primary);font-size:12px;padding:4px 10px;border-radius:16px;cursor:pointer;font-weight:600;font-family:inherit;}
.lang-btn:hover{background:var(--color-border-tertiary);}

.hdr h1{font-size:20px;font-weight:500;color:var(--color-text-primary)}
.hdr p{font-size:13px;color:var(--color-text-secondary);margin-top:4px}
.arabic{font-size:22px;color:var(--color-text-secondary);margin-bottom:6px; font-family: sans-serif;}

/* Grid Menu */
.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:1rem;}
.menu-card{background:var(--color-background-primary);border:1px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:1.5rem 1rem;text-align:center;cursor:pointer;transition:all 0.2s;}
.menu-card:hover{border-color:#1D9E75;box-shadow:0 4px 12px rgba(29,158,117,0.1);background:#F0FDF4;}
.menu-icon{font-size:28px;margin-bottom:8px;}
.menu-title{font-size:15px;font-weight:500;color:var(--color-text-primary);}

/* Step Progress & General UI */
.prog{display:flex;gap:4px;margin-bottom:1.5rem}
.prog-item{flex:1;text-align:center}
.prog-bar{height:3px;border-radius:2px;margin-bottom:4px;background:var(--color-border-tertiary)}
.prog-bar.active{background:#1D9E75}
.prog-label{font-size:10px;color:var(--color-text-tertiary);text-transform:uppercase;letter-spacing:.05em}
.prog-label.active{color:#0F6E56}

.card{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:1.25rem}
.step-title{font-size:17px;font-weight:500;color:var(--color-text-primary);margin-bottom:4px}
.step-desc{font-size:13px;color:var(--color-text-secondary);line-height:1.5;margin-bottom:1rem}
.choices{display:flex;gap:8px;flex-wrap:wrap;margin-top:1rem}
.choice-btn{padding:10px 24px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-secondary);background:var(--color-background-primary);color:var(--color-text-primary);font-size:14px;cursor:pointer;font-family:inherit;transition:all .15s}
.choice-btn:hover{background:var(--color-background-secondary)}
.choice-btn.sel{border:1.5px solid #1D9E75;background:#E1F5EE;color:#085041}
.row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:0.5px solid var(--color-border-tertiary)}
.row:last-child{border-bottom:none}
.row label{font-size:14px;color:var(--color-text-primary);flex:1;}

.counter, .toggle{display:flex;align-items:center;gap:10px}
.ctr-btn{width:28px;height:28px;border-radius:50%;border:0.5px solid var(--color-border-secondary);background:var(--color-background-primary);color:var(--color-text-primary);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1}
.ctr-btn:hover{background:var(--color-background-secondary)}
.ctr-val{font-size:15px;font-weight:500;color:var(--color-text-primary);min-width:20px;text-align:center}
.tog-btn{padding:6px 16px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-secondary);background:var(--color-background-primary);color:var(--color-text-secondary);font-size:13px;cursor:pointer;font-family:inherit; transition:all 0.15s;}
.tog-btn.on{border:1px solid #1D9E75;background:#E1F5EE;color:#085041}

.val-input{width:120px;padding:8px 12px;border-radius:var(--border-radius-md);border:1px solid var(--color-border-secondary);font-size:15px;text-align:right;font-family:inherit;}
.val-input:focus{outline:none;border-color:#1D9E75;box-shadow: 0 0 0 2px rgba(29,158,117,0.2);}

.verse-note, .alert{margin-top:1rem;padding:10px 14px;border-radius:var(--border-radius-md);font-size:13px;line-height:1.6}
.verse-note{background:var(--color-background-secondary);border-left:2px solid #1D9E75;border-radius:0 var(--border-radius-md) var(--border-radius-md) 0;color:var(--color-text-secondary);}
.verse-ref{color:#0F6E56;font-weight:500}
.alert{background:#FAEEDA;border-left:2px solid #EF9F27;color:#633806;}\n.alert.success{background:#E1F5EE;border-left:2px solid #1D9E75;color:#085041;}

.nav{display:flex;justify-content:space-between;margin-top:12px; gap:8px;}
.nav-btn{padding:9px 22px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-secondary);background:var(--color-background-primary);color:var(--color-text-secondary);font-size:14px;cursor:pointer;font-family:inherit;font-weight:500;transition:all 0.15s; flex:1;}
.nav-btn:hover:not(:disabled){background:var(--color-background-secondary)}
.nav-btn.prim{border:0.5px solid #1D9E75;color:white;background:#1D9E75}
.nav-btn.prim:hover:not(:disabled){background:#15805e}
.nav-btn:disabled{opacity:.4;cursor:not-allowed}

/* Results Formatting */
.heir-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--border-radius-md);background:var(--color-background-secondary);margin-bottom:6px}
.heir-info{flex:1}
.heir-name{font-size:14px;color:var(--color-text-primary)}
.heir-frac{text-align:right}
.heir-f{font-size:16px;font-weight:500;color:var(--color-text-primary)}

/* Trackers */
.tracker-list { display: flex; flex-direction: column; gap: 1rem; margin-top: 1rem; }
.tracker-card { display: flex; flex-direction: column; border: 1px solid var(--color-border-secondary); border-radius: var(--border-radius-md); overflow: hidden; background: var(--color-background-primary); cursor: pointer; transition: all 0.2s; }
.tracker-card.completed { background: #F0FDF4; border-color: #9FE1CB; opacity: 0.85; }
.tracker-content { padding: 1rem; display: flex; align-items: center; gap: 12px; }
.tracker-text { flex: 1; }
.tracker-title { font-size: 15px; font-weight: 600; color: var(--color-text-primary); margin-bottom: 4px; }
.tracker-card.completed .tracker-title { text-decoration: line-through; color: var(--color-text-secondary); }
.tracker-check { width: 26px; height: 26px; border: 2px solid var(--color-border-secondary); border-radius: 6px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; background: white; transition: all 0.2s; }
.tracker-card.completed .tracker-check { background: #1D9E75; border-color: #1D9E75; color: white; }

.placeholder-view{text-align:center;padding:3rem 1rem;}
</style>
</head>
<body>

<div class="wrap">
  <div class="hdr">
    <button id=\"btn-back\" class="back-btn" onclick="openMenu()">← Back</button>
    <button id=\"btn-lang\" class="lang-btn" onclick="toggleLang()">اردو</button>
    <div class="arabic">﷽</div>
    <h1 id="app-title">Islamic Knowledge Hub</h1>
    <p id="app-desc">Select a tool to begin</p>
  </div>
  
  <div class="prog" id="prog" style="display:none"></div>
  <div class="card" id="card"></div>
  <div class="nav" id="nav" style="display:none"></div>
</div>

<script>
// ==== i18n DICTIONARY ====
const DICT = {
  en: {
    appTitle: "Islamic Knowledge Hub", appDesc: "Select a tool to begin", backMenu: "← Back to Menu", btnLang: "اردو",
    menuInh: "Inheritance", menuZak: "Zakat", menuUmr: "Umrah Tracker", menuHaj: "Hajj Tracker",
    btnBack: "← Back", btnNext: "Next →", btnStartOver: "↺ Start over", btnCalc: "Calculate →",
    zTitle: "Zakat Calculator", zDesc: "2.5% obligatory charity", zSteps: ['Assets', 'Debts', 'Results'],
    zS1Cash: "Cash and Bank", zS2Debt: "Debts", zS3Net: "Net Wealth", zS3Due: "Zakat Due",
    iTitle: "Inheritance Calculator", iDesc: "Based on Surah An-Nisa", iSteps: ['Gender', 'Spouse', 'Children', 'Parents', 'Results'],
    uTitle: "Umrah Tracker", hTitle: "Hajj Tracker",
    uData: [{t:'Ihram', d:'Set intention'}, {t:'Tawaf', d:'7 Circuits'}, {t:'Sa\'i', d:'7 Walks'}, {t:'Halq', d:'Trim hair'}]
  },
  ur: {
    appTitle: "مرکزِ علومِ اسلامیہ", appDesc: "شروع کرنے کے لیے ایک ٹول منتخب کریں", backMenu: "مینو پر واپس جائیں", btnLang: "English",
    menuInh: "وراثت", menuZak: "زکوٰۃ", menuUmr: "عمرہ ٹریکر", menuHaj: "حج ٹریکر",
    btnBack: "پیچھے", btnNext: "آگے", btnStartOver: "دوبارہ شروع کریں", btnCalc: "حساب لگائیں",
    zTitle: "زکوٰۃ کیلکولیٹر", zDesc: "فرض زکوٰۃ کا حساب لگائیں", zSteps: ['اثاثے', 'قرضے', 'نتائج'],
    iTitle: "وراثت کیلکولیٹر", iDesc: "سورۃ النساء کی روشنی میں", iSteps: ['جنس', 'شریک حیات', 'بچے', 'والدین', 'نتائج']
  }
};

let LANG = localStorage.getItem('appLang') || 'en';
function t(key) { return (DICT[LANG] && DICT[LANG][key]) || DICT['en'][key] || key; }

function toggleLang() {
  LANG = LANG === 'en' ? 'ur' : 'en';
  localStorage.setItem('appLang', LANG);
  renderApp();
}

// ==== STATE ====
let currentTool = 'menu';
let step = 0;
let S_INH = { gender: null, hasSpouse: false, sons: 0, daughters: 0, father: false, mother: false };
let S_ZAK = { cash: 0, debts: 0 };
let S_TRACK = JSON.parse(localStorage.getItem('trackState')) || { umrah: [false, false, false, false] };

function openMenu() { currentTool = 'menu'; step = 0; renderApp(); }
function startTool(tool) { currentTool = tool; step = 0; renderApp(); }

function renderApp() {
  document.body.className = LANG === 'ur' ? 'rtl' : '';
  const card = document.getElementById('card');
  const prog = document.getElementById('prog');
  const nav = document.getElementById('nav');
  const back = document.getElementById('btn-back');
  
  document.getElementById('btn-lang').innerText = t('btnLang');
  
  if (currentTool === 'menu') {
    document.getElementById('app-title').textContent = t('appTitle');
    document.getElementById('app-desc').textContent = t('appDesc');
    back.style.display = 'none';
    prog.style.display = 'none';
    nav.style.display = 'none';
    card.innerHTML = `
      <div class="menu-grid">
        <div class="menu-card" onclick="startTool('inheritance')">⚖️<br>${t('menuInh')}</div>
        <div class="menu-card" onclick="startTool('zakat')">💰<br>${t('menuZak')}</div>
        <div class="menu-card" onclick="startTool('umrah')">🕋<br>${t('menuUmr')}</div>
        <div class="menu-card" onclick="startTool('hajj')">⛺<br>${t('menuHaj')}</div>
      </div>`;
    return;
  }

  back.style.display = 'block';
  if (currentTool === 'zakat') renderZakat();
  else if (currentTool === 'inheritance') renderInheritance();
  else if (currentTool === 'umrah') renderTracker('umrah');
}

function renderZakat() {
  const steps = t('zSteps');
  renderProg(steps);
  const nav = document.getElementById('nav');
  nav.style.display = 'flex';
  
  let html = '';
  if (step === 0) {
    html = `<h3>${t('zS1Cash')}</h3><input type="number" class="val-input" onchange="S_ZAK.cash=this.value" value="${S_ZAK.cash}">`;
  } else if (step === 1) {
    html = `<h3>${t('zS2Debt')}</h3><input type="number" class="val-input" onchange="S_ZAK.debts=this.value" value="${S_ZAK.debts}">`;
  } else {
    let net = S_ZAK.cash - S_ZAK.debts;
    let due = net > 0 ? net * 0.025 : 0;
    html = `<div class="heir-row"><span>${t('zS3Net')}</span><span>${net}</span></div>
            <div class="heir-row" style="background:#E1F5EE"><strong>${t('zS3Due')}</strong><strong>${due.toFixed(2)}</strong></div>`;
  }
  document.getElementById('card').innerHTML = html;
  renderNav(steps.length);
}

function renderInheritance() {
    const steps = t('iSteps');
    renderProg(steps);
    document.getElementById('nav').style.display = 'flex';
    let html = `<h3>${steps[step]}</h3>`;
    
    if(step === 0) {
        html += `<button class="choice-btn ${S_INH.gender==='m'?'sel':''}" onclick="S_INH.gender='m';renderApp()">Male</button>
                 <button class="choice-btn ${S_INH.gender==='f'?'sel':''}" onclick="S_INH.gender='f';renderApp()">Female</button>`;
    } else if(step === 4) {
        html = `<div>Calculation based on Quranic shares... (Simplified)</div>`;
    } else {
        html += `<p>Enter details for step ${step}</p>`;
    }
    
    document.getElementById('card').innerHTML = html;
    renderNav(steps.length);
}

function renderTracker(type) {
    const data = t('uData');
    let html = '<div class="tracker-list">';
    data.forEach((item, i) => {
        const done = S_TRACK.umrah[i];
        html += `
            <div class="tracker-card ${done?'completed':''}" onclick="toggleStep(${i})">
                <div class="tracker-content">
                    <div class="tracker-check">${done?'✓':''}</div>
                    <div class="tracker-text">
                        <div class="tracker-title">${item.t}</div>
                        <div class="tracker-desc">${item.d}</div>
                    </div>
                </div>
            </div>`;
    });
    html += '</div>';
    document.getElementById('card').innerHTML = html;
    document.getElementById('nav').style.display = 'none';
    document.getElementById('prog').style.display = 'none';
}

function toggleStep(i) {
    S_TRACK.umrah[i] = !S_TRACK.umrah[i];
    localStorage.setItem('trackState', JSON.stringify(S_TRACK));
    renderApp();
}

function renderProg(arr) {
  const p = document.getElementById('prog');
  p.style.display = 'flex';
  p.innerHTML = arr.map((s,i)=>`<div class="prog-item"><div class="prog-bar ${i<=step?'active':''}"></div></div>`).join('');
}

function renderNav(max) {
  const n = document.getElementById('nav');
  const nextTxt = step === max - 1 ? t('btnStartOver') : (step === max - 2 ? t('btnCalc') : t('btnNext'));
  n.innerHTML = `
    <button class="nav-btn" onclick="if(step>0)step--;renderApp()">Back</button>
    <button class="nav-btn prim" onclick="if(step<${max-1}){step++;renderApp()}else{openMenu()}">${nextTxt}</button>`;
}

// Initial Run
renderApp();
</script>
</body>
</html>
