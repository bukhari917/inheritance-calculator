<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Islamic Knowledge Hub</title>
<script src="https://cdn.jsdelivr.net/npm/adhan@4.3.3/lib/adhan.umd.min.js"></script>
<style>
:root {
  --font-sans: system-ui, -apple-system, sans-serif;
  --color-text-primary: #111827;
  --color-text-secondary: #4B5563;
  --color-text-tertiary: #9CA3AF;
  --color-background-primary: #ffffff;
  --color-background-secondary: #F3F4F6;
  --color-background-tertiary: #E5E7EB;
  --color-border-secondary: #D1D5DB;
  --color-border-tertiary: #E5E7EB;
  --border-radius-md: 8px;
  --border-radius-lg: 12px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans); background: #f9fafb;}
.wrap{max-width:560px;margin:0 auto;padding:1.5rem 1rem}
.hdr{text-align:center;margin-bottom:1.5rem;position:relative;}
.home-btn{position:absolute;left:0;top:50%;transform:translateY(-50%);background:none;border:none;color:#1D9E75;font-size:14px;cursor:pointer;font-weight:500;}
.hdr h1{font-size:20px;font-weight:500;color:var(--color-text-primary)}
.hdr p{font-size:13px;color:var(--color-text-secondary);margin-top:4px}
.arabic{font-size:22px;color:var(--color-text-secondary);margin-bottom:6px}

/* Grid Menu */
.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.menu-card{background:var(--color-background-primary);border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-lg);padding:1.5rem 1rem;text-align:center;cursor:pointer;transition:all 0.2s;display:flex;flex-direction:column;align-items:center;gap:8px;}
.menu-card:hover{border-color:#1D9E75;box-shadow:0 4px 12px rgba(29,158,117,0.1);}
.menu-icon{font-size:24px;}
.menu-title{font-size:14px;font-weight:500;color:var(--color-text-primary);}

/* Step Progress & General UI */
.prog{display:flex;gap:4px;margin-bottom:1.5rem}
.prog-item{flex:1;text-align:center}
.prog-bar{height:3px;border-radius:2px;margin-bottom:4px;background:var(--color-border-tertiary)}
.prog-bar.active{background:#1D9E75}
.prog-label{font-size:10px;color:var(--color-text-tertiary);text-transform:uppercase;letter-spacing:.05em}
.prog-label.active{color:#0F6E56}

.card{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:1.25rem}
.step-title{font-size:17px;font-weight:500;color:var(--color-text-primary);margin-bottom:4px}
.step-desc{font-size:13px;color:var(--color-text-secondary);line-height:1.5;margin-bottom:1rem}
.choices{display:flex;gap:8px;flex-wrap:wrap;margin-top:1rem}
.choice-btn{padding:10px 24px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-secondary);background:var(--color-background-primary);color:var(--color-text-primary);font-size:14px;cursor:pointer;font-family:inherit;transition:all .15s}
.choice-btn:hover{background:var(--color-background-secondary)}
.choice-btn.sel{border:1.5px solid #1D9E75;background:#E1F5EE;color:#085041}
.row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:0.5px solid var(--color-border-tertiary)}
.row:last-child{border-bottom:none}
.row label{font-size:14px;color:var(--color-text-primary);flex:1;}
.counter, .toggle{display:flex;align-items:center;gap:10px}
.ctr-btn{width:28px;height:28px;border-radius:50%;border:0.5px solid var(--color-border-secondary);background:var(--color-background-primary);color:var(--color-text-primary);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1}
.ctr-btn:hover{background:var(--color-background-secondary)}
.ctr-val{font-size:15px;font-weight:500;color:var(--color-text-primary);min-width:20px;text-align:center}
.tog-btn{padding:6px 16px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-secondary);background:var(--color-background-primary);color:var(--color-text-secondary);font-size:13px;cursor:pointer;font-family:inherit}
.tog-btn.on{border:1px solid #1D9E75;background:#E1F5EE;color:#085041}
.val-input{width:100px;padding:6px 10px;border-radius:6px;border:1px solid var(--color-border-secondary);font-size:14px;text-align:right;}
.val-input:focus{outline:none;border-color:#1D9E75;}

.verse-note, .alert{margin-top:1rem;padding:10px 14px;border-radius:var(--border-radius-md);font-size:12px;line-height:1.6}
.verse-note{background:var(--color-background-secondary);border-left:2px solid #1D9E75;border-radius:0 var(--border-radius-md) var(--border-radius-md) 0;color:var(--color-text-secondary);}
.verse-ref{color:#0F6E56;font-weight:500}
.alert{background:#FAEEDA;border-left:2px solid #EF9F27;color:#633806;}
.alert.success{background:#E1F5EE;border-left:2px solid #1D9E75;color:#085041;}

.nav{display:flex;justify-content:space-between;margin-top:12px}
.nav-btn{padding:9px 22px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-secondary);background:var(--color-background-primary);color:var(--color-text-secondary);font-size:14px;cursor:pointer;font-family:inherit}
.nav-btn:hover{background:var(--color-background-secondary)}
.nav-btn.prim{border:0.5px solid #1D9E75;color:#0F6E56;background:var(--color-background-primary)}
.nav-btn.prim:hover{background:#E1F5EE}
.nav-btn:disabled{opacity:.35;cursor:not-allowed}

/* Results Formatting (Inheritance/Zakat) */
.dist-bar{display:flex;height:24px;border-radius:var(--border-radius-md);overflow:hidden;border:0.5px solid var(--color-border-tertiary);margin-bottom:1rem}
.heir-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--border-radius-md);background:var(--color-background-secondary);margin-bottom:6px}
.heir-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.heir-info{flex:1}
.heir-name{font-size:14px;color:var(--color-text-primary)}
.heir-basis{font-size:11px;color:var(--color-text-tertiary);margin-top:2px}
.heir-frac{text-align:right}
.heir-f{font-size:16px;font-weight:500;color:var(--color-text-primary)}
.heir-p{font-size:11px;color:var(--color-text-secondary)}
.total-row{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-radius:var(--border-radius-md);border:0.5px solid #9FE1CB;background:#E1F5EE;margin-top:10px}
.total-label{font-size:13px;color:#085041}
.total-val{font-size:14px;font-weight:500;color:#0F6E56}
.no-heirs{text-align:center;padding:2rem 0;color:var(--color-text-secondary);font-size:14px}

/* Checklists & E-Numbers */
.search-box{width:100%;padding:12px;border-radius:var(--border-radius-md);border:1px solid var(--color-border-secondary);font-size:15px;margin-bottom:1rem;font-family:inherit;}
.search-box:focus{outline:none;border-color:#1D9E75;}
.status-pill{display:inline-block;padding:4px 10px;border-radius:12px;font-size:12px;font-weight:600;margin-bottom:8px;}
.status-halal{background:#E1F5EE;color:#085041;}
.status-haram{background:#FEE2E2;color:#991B1B;}
.status-mushbooh{background:#FEF3C7;color:#92400E;}

.check-item{display:flex;align-items:center;gap:10px;padding:12px 10px;border-bottom:0.5px solid var(--color-border-tertiary);cursor:pointer;}
.check-item:last-child{border-bottom:none;}
.check-box{width:20px;height:20px;border-radius:4px;border:1px solid var(--color-border-secondary);display:flex;align-items:center;justify-content:center;color:white;font-size:12px;background:white;}
.check-box.checked{background:#1D9E75;border-color:#1D9E75;}
.check-label{font-size:14px;color:var(--color-text-primary);flex:1;}
.check-label.checked{text-decoration:line-through;color:var(--color-text-tertiary);}

/* Prayer & Compass */
.prayer-time{display:flex;justify-content:space-between;padding:12px 14px;border-bottom:0.5px solid var(--color-border-tertiary);font-size:15px;}
.prayer-time.active{background:#1D9E75;color:white;border-radius:var(--border-radius-md);border-bottom:none;font-weight:500;}
.compass-wrap{position:relative;width:150px;height:150px;margin:2rem auto;border-radius:50%;border:4px solid var(--color-border-secondary);background:var(--color-background-secondary);display:flex;align-items:center;justify-content:center;}
.compass-center{width:10px;height:10px;background:#1D9E75;border-radius:50%;z-index:2;}
.compass-needle{position:absolute;width:4px;height:120px;background:linear-gradient(to bottom, #1D9E75 50%, #9CA3AF 50%);border-radius:4px;transition:transform 0.5s ease;z-index:1;}
.qibla-text{text-align:center;font-size:14px;color:var(--color-text-secondary);margin-bottom:1rem;}
</style>
</head>
<body>

<div class="wrap">
  <div class="hdr">
    <button id="btn-home" class="home-btn" onclick="goHome()" style="display:none">← Menu</button>
    <div class="arabic">﷽</div>
    <h1 id="app-title">Islamic Knowledge Hub</h1>
    <p id="app-subtitle">Select a tool to get started</p>
  </div>
  
  <div class="prog" id="prog" style="display:none"></div>
  <div class="card" id="card" style="display:none; border:none; background:transparent; padding:0;"></div>
  <div class="nav" id="nav" style="display:none"></div>
</div>

<script>
// ==== MATH & UTILS ====
const gcd=(a,b)=>b===0?a:gcd(b,a%b);
const F=(n,d)=>{if(n<=0||d<=0)return{n:0,d:1};const g=gcd(n,d);return{n:n/g,d:d/g}};
const fadd=(a,b)=>F(a.n*b.d+b.n*a.d,a.d*b.d);
const fsub=(a,b)=>{const n=a.n*b.d-b.n*a.d;return n<=0?{n:0,d:1}:F(n,a.d*b.d)};
const fval=f=>f.n/f.d;
const fpct=f=>(fval(f)*100).toFixed(1)+'%';
const fstr=f=>{if(f.n===0)return'0';if(f.d===1)return`${f.n}`;return`${f.n}/${f.d}`};

// ==== GLOBAL APP STATE ====
let currentTool = 'home';
let step = 0;

// Inheritence State
const INH_STEPS=['Deceased','Spouse','Children','Parents','Siblings','Results'];
const PALETTE=['#1D9E75','#BA7517','#185FA5','#993556','#A32D2D','#534AB7','#3B6D11','#854F0B'];
let S_INH={gender:null,hasHusband:false,numWives:0,sons:0,daughters:0,fatherAlive:false,motherAlive:false,fullBrothers:0,fullSisters:0,uterineSiblings:0};

// Zakat State (Constants for Nisab estimate)
const ZAK_STEPS=['Assets','Debts','Results'];
const GOLD_PRICE_PER_GRAM = 70; // Approximation USD
const SILVER_PRICE_PER_GRAM = 0.85; 
const NISAB_VALUE = 85 * GOLD_PRICE_PER_GRAM; // Standard 85g gold Nisab
let S_ZAK={cash:0, goldGrams:0, silverGrams:0, business:0, debts:0};

// Hajj Tracker State
const TRK_STEPS=['Preparation','Tawaf','Sa\'i'];
const TRK_DATA = {
  0: [{id:'p1', t:'Ihram intentions made'}, {id:'p2', t:'Ghusl completed'}, {id:'p3', t:'Talbiyah recited'}],
  1: [{id:'t1', t:'Wudu verified'}, {id:'t2', t:'7 circuits completed'}, {id:'t3', t:'2 Rakat at Maqam Ibrahim'}, {id:'t4', t:'Drank Zamzam'}],
  2: [{id:'s1', t:'Ascended Safa'}, {id:'s2', t:'Completed 7 laps (Safa-Marwa)'}, {id:'s3', t:'Hair cut/shaved (Tahallul)'}]
};
let S_TRK = JSON.parse(localStorage.getItem('hajjTracker')) || {p1:false,p2:false,p3:false,t1:false,t2:false,t3:false,t4:false,s1:false,s2:false,s3:false};

// E-Numbers DB (Sample)
const ENUMS = {
  'E120': {status:'haram', d:'Carmine / Cochineal (Derived from insects)'},
  'E100': {status:'halal', d:'Curcumin (Plant based)'},
  'E471': {status:'mushbooh', d:'Mono- & Diglycerides (Could be animal or plant based)'},
  'E422': {status:'mushbooh', d:'Glycerol / Glycerin (Can be animal fat or vegetable oil)'},
  'E300': {status:'halal', d:'Ascorbic Acid (Vitamin C)'},
  'E441': {status:'haram', d:'Gelatine (Often pig/non-halal slaughtered animal unless certified)'}
};
let S_ENUM = '';

// Prayer/Location State
let S_LOC = {lat: null, lng: null, err: null};

// ==== ROUTING ====
function goHome() { currentTool = 'home'; renderApp(); }
function startTool(tool) { currentTool = tool; step = 0; renderApp(); }

function renderApp() {
  const card = document.getElementById('card');
  const prog = document.getElementById('prog');
  const nav = document.getElementById('nav');
  const btnHome = document.getElementById('btn-home');
  const title = document.getElementById('app-title');
  const subtitle = document.getElementById('app-subtitle');

  if(currentTool === 'home') {
    btnHome.style.display = 'none';
    prog.style.display = 'none';
    nav.style.display = 'none';
    card.style.display = 'block';
    title.textContent = 'Islamic Knowledge Hub';
    subtitle.textContent = 'Select a tool to get started';
    
    card.innerHTML = `
      <div class="menu-grid">
        <div class="menu-card" onclick="startTool('inheritance')">
          <div class="menu-icon">⚖️</div>
          <div class="menu-title">Inheritance<br>Calculator</div>
        </div>
        <div class="menu-card" onclick="startTool('zakat')">
          <div class="menu-icon">💰</div>
          <div class="menu-title">Zakat<br>Calculator</div>
        </div>
        <div class="menu-card" onclick="startTool('enumber')">
          <div class="menu-icon">🔍</div>
          <div class="menu-title">Halal E-Number<br>Checker</div>
        </div>
        <div class="menu-card" onclick="startTool('hajj')">
          <div class="menu-icon">🕋</div>
          <div class="menu-title">Umrah/Hajj<br>Tracker</div>
        </div>
        <div class="menu-card" onclick="startTool('prayer')" style="grid-column: span 2;">
          <div class="menu-icon">🧭</div>
          <div class="menu-title">Prayer Times & Qibla</div>
        </div>
      </div>`;
    return;
  }

  btnHome.style.display = 'block';
  card.style.display = 'block';
  card.style.border = '0.5px solid var(--color-border-tertiary)';
  card.style.background = 'var(--color-background-primary)';
  card.style.padding = '1.25rem';
  
  if (currentTool === 'inheritance') {
    title.textContent = 'Inheritance Calculator';
    subtitle.textContent = 'Based on Surah An-Nisa';
    prog.style.display = 'flex';
    nav.style.display = 'flex';
    renderProg(INH_STEPS);
    renderInheritance();
    renderNav(INH_STEPS.length);
  } else if (currentTool === 'zakat') {
    title.textContent = 'Zakat Calculator';
    subtitle.textContent = 'Calculate 2.5% on qualifying wealth';
    prog.style.display = 'flex';
    nav.style.display = 'flex';
    renderProg(ZAK_STEPS);
    renderZakat();
    renderNav(ZAK_STEPS.length);
  } else if (currentTool === 'hajj') {
    title.textContent = 'Umrah & Hajj Tracker';
    subtitle.textContent = 'Interactive ritual checklist';
    prog.style.display = 'flex';
    nav.style.display = 'flex';
    renderProg(TRK_STEPS);
    renderHajj();
    renderNav(TRK_STEPS.length);
  } else if (currentTool === 'enumber') {
    title.textContent = 'E-Number Checker';
    subtitle.textContent = 'Search food additives statuses';
    prog.style.display = 'none';
    nav.style.display = 'none';
    renderENumber();
  } else if (currentTool === 'prayer') {
    title.textContent = 'Prayer Times & Qibla';
    subtitle.textContent = 'Local times based on device coordinates';
    prog.style.display = 'none';
    nav.style.display = 'none';
    renderPrayer();
  }
}

// ==== UI HELPERS ====
function renderProg(arr) {
  document.getElementById('prog').innerHTML=arr.map((s,i)=>`<div class="prog-item"><div class="prog-bar ${i<=step?'active':''}"></div><span class="prog-label ${i===step?'active':''}">${s}</span></div>`).join('');
}
function renderNav(maxSteps) {
  const nav=document.getElementById('nav');
  const backDisabled = step===0;
  let nextTxt = 'Next →';
  if(step === maxSteps-1) nextTxt = '↺ Start over';
  else if(step === maxSteps-2) nextTxt = 'Calculate →';
  
  let nextDisabled = false;
  if(currentTool === 'inheritance' && step === 0 && !S_INH.gender) nextDisabled = true;

  nav.innerHTML=`
    <button class="nav-btn" onclick="goBack()" ${backDisabled?'disabled':''}>← Back</button>
    <button class="nav-btn prim" onclick="goNext(${maxSteps})" ${nextDisabled?'disabled':''}>${nextTxt}</button>
  `;
}
function goNext(max){if(step<max-1)step++;else{resetTool();}renderApp();}
function goBack(){if(step>0)step--;renderApp();}
function resetTool() {
  step = 0;
  if(currentTool==='inheritance') S_INH={gender:null,hasHusband:false,numWives:0,sons:0,daughters:0,fatherAlive:false,motherAlive:false,fullBrothers:0,fullSisters:0,uterineSiblings:0};
  if(currentTool==='zakat') S_ZAK={cash:0, goldGrams:0, silverGrams:0, business:0, debts:0};
}
function adj(k,d,max=10){if(currentTool==='inheritance')S_INH[k]=Math.max(0,Math.min(max,S_INH[k]+d)); renderApp();}
function tog(k,v){if(currentTool==='inheritance')S_INH[k]=v; renderApp();}
function setZ(k,v){S_ZAK[k]=Number(v)||0; renderApp();}

function Ctr(lbl,key,max=10){return`<div class="row"><label>${lbl}</label><div class="counter"><button class="ctr-btn" onclick="adj('${key}',-1)">−</button><span class="ctr-val">${S_INH[key]}</span><button class="ctr-btn" onclick="adj('${key}',1,${max})">+</button></div></div>`;}
function Tog(lbl,key){return`<div class="row"><label>${lbl}</label><div class="toggle"><button class="tog-btn ${S_INH[key]?'on':''}" onclick="tog('${key}',true)">Yes</button><button class="tog-btn ${!S_INH[key]?'on':''}" onclick="tog('${key}',false)">No</button></div></div>`;}
function Inp(lbl,key,ph){return`<div class="row"><label>${lbl}</label><input type="number" class="val-input" placeholder="${ph}" value="${S_ZAK[key]||''}" oninput="setZ('${key}',this.value)"></div>`;}

// ==== TOOL: INHERITANCE ====
function renderInheritance() {
  const c = document.getElementById('card');
  const {gender,hasHusband,numWives,sons,daughters,fatherAlive,motherAlive,fullBrothers,fullSisters,uterineSiblings} = S_INH;
  
  if(step===0) c.innerHTML=`<p class="step-title">The deceased</p><p class="step-desc">Select the gender of the person who has passed away</p><div class="choices"><button class="choice-btn ${gender==='male'?'sel':''}" onclick="S_INH.gender='male';renderApp()">Male</button><button class="choice-btn ${gender==='female'?'sel':''}" onclick="S_INH.gender='female';renderApp()">Female</button></div>`;
  else if(step===1){let html=`<p class="step-title">Surviving spouse</p>`;if(gender==='male'){html+=`<p class="step-desc">How many wives does the deceased leave?</p>${Ctr('Number of wives','numWives',4)}`;}else html+=`<p class="step-desc">Is there a surviving husband?</p>${Tog('Husband is surviving','hasHusband')}`;html+=`<div class="verse-note"><span class="verse-ref">4:12</span> — Shares differ if there are children.</div>`;c.innerHTML=html;}
  else if(step===2) c.innerHTML=`<p class="step-title">Children</p><p class="step-desc">How many sons and daughters?</p>${Ctr('Sons','sons')}${Ctr('Daughters','daughters')}<div class="verse-note"><span class="verse-ref">4:11</span> — Sons and daughters share residue 2:1.</div>`;
  else if(step===3) c.innerHTML=`<p class="step-title">Parents</p><p class="step-desc">Living parents?</p>${Tog('Father is alive','fatherAlive')}${Tog('Mother is alive','motherAlive')}<div class="verse-note"><span class="verse-ref">4:11</span> — Parents get 1/6th each if there are children.</div>`;
  else if(step===4) c.innerHTML=`<p class="step-title">Siblings</p><p class="step-desc">Inherit if no children/father.</p>${Ctr('Full brothers','fullBrothers')}${Ctr('Full sisters','fullSisters')}${Ctr('Uterine siblings','uterineSiblings')}<div class="verse-note"><span class="verse-ref">4:176</span> — Sibling rules apply in Kalalah (no direct ascendants/descendants).</div>`;
  else if(step===5){
    const r=computeInh();
    if(!r.heirs.length){c.innerHTML='<div class="no-heirs">No qualifying heirs.</div>';return;}
    const totalPct=(fval(r.total)*100).toFixed(1);
    let bar=r.heirs.map(h=>`<div style="width:${Math.min(100,(fval(h.frac)/Math.max(fval(r.total),0.001))*100).toFixed(2)}%;background:${h.color}"></div>`).join('');
    if(r.hasRemainder&&!r.isAul) bar+=`<div style="flex:1;background:var(--color-background-tertiary)"></div>`;
    let rows=r.heirs.map(h=>`<div class="heir-row"><div class="heir-dot" style="background:${h.color}"></div><div class="heir-info"><div class="heir-name">${h.name}</div></div><div class="heir-frac"><div class="heir-f">${fstr(h.frac)}</div><div class="heir-p">${fpct(h.frac)}</div></div></div>`).join('');
    c.innerHTML=`<div class="dist-bar">${bar}</div>${rows}<div class="total-row"><span class="total-label">Assigned</span><span class="total-val">${fstr(r.total)} · ${totalPct}%</span></div>`;
  }
}
function computeInh() {
  const {gender,hasHusband,numWives,sons,daughters,fatherAlive,motherAlive,fullBrothers,fullSisters,uterineSiblings} = S_INH;
  const hasChild=sons>0||daughters>0,hasSons=sons>0,hasDaus=daughters>0;
  const sibTotal=fullBrothers+fullSisters+uterineSiblings;
  const heirs=[];let used={n:0,d:1};let ci=0;
  function add(name,f,basis){if(fval(f)>0.00001){heirs.push({name,frac:f,color:PALETTE[ci++%PALETTE.length]});used=fadd(used,f);}}
  if(gender==='male'&&numWives>0) add(numWives===1?'Wife':`Wives (×${numWives})`,F(hasChild?1:2,8*numWives));
  if(gender==='female'&&hasHusband) add('Husband',F(hasChild?1:2,4));
  if(motherAlive) add('Mother',F(1,(hasChild||sibTotal>=2)?6:3));
  if(fatherAlive&&hasChild) add('Father',F(1,6));
  if(hasDaus&&!hasSons) add(daughters===1?'Daughter':`Daughters (×${daughters})`,F(daughters===1?1:2,daughters===1?2:3));
  const res=fsub({n:1,d:1},used);
  if(fval(res)>0.00001){
    if(hasSons){if(hasDaus){const u=sons*2+daughters;add(`Son (×${sons})`,F(res.n*2,res.d*u));add(`Daughter (×${daughters})`,F(res.n,res.d*u));}else add(`Son (×${sons})`,F(res.n,res.d*sons));}
    else if(!hasChild&&fatherAlive){add('Father (Residue)',res);}
  }
  const total=heirs.reduce((a,h)=>fadd(a,h.frac),{n:0,d:1});
  return{heirs,total,isAul:fval(total)>1.001,hasRemainder:fval(total)<0.999&&heirs.length>0};
}

// ==== TOOL: ZAKAT ====
function renderZakat() {
  const c = document.getElementById('card');
  if(step===0) {
    c.innerHTML=`<p class="step-title">Zakatable Assets</p><p class="step-desc">Enter the value of your liquid assets. Leave empty if 0.</p>
    ${Inp('Cash in hand / Bank','cash','0.00')}
    ${Inp('Gold value (or g × price)','goldGrams','0.00')}
    ${Inp('Silver value (or g × price)','silverGrams','0.00')}
    ${Inp('Business stock/trade goods','business','0.00')}
    <div class="verse-note">Zakat is 2.5% on qualifying wealth held for a lunar year (Hawl).</div>`;
  } else if(step===1) {
    c.innerHTML=`<p class="step-title">Deductible Debts</p><p class="step-desc">Enter immediate debts due.</p>
    ${Inp('Immediate Debts/Bills','debts','0.00')}
    <div class="verse-note">Long term debts (like mortgages) usually only deduct the upcoming month/year installments based on scholarly opinion.</div>`;
  } else if(step===2) {
    const assets = S_ZAK.cash + S_ZAK.goldGrams + S_ZAK.silverGrams + S_ZAK.business;
    const net = assets - S_ZAK.debts;
    const isNisab = net >= NISAB_VALUE;
    const zakatDue = isNisab ? net * 0.025 : 0;
    
    let html = `<p class="step-title">Zakat Calculation</p><div style="margin:1rem 0;">
      <div class="row"><label>Total Assets</label><span>$${assets.toFixed(2)}</span></div>
      <div class="row"><label>Total Debts</label><span>-$${S_ZAK.debts.toFixed(2)}</span></div>
      <div class="row" style="font-weight:500;"><label>Net Wealth</label><span>$${net.toFixed(2)}</span></div>
      <div class="row" style="color:var(--color-text-tertiary);font-size:12px;"><label>Current Nisab Threshold (Estimated)</label><span>$${NISAB_VALUE.toFixed(2)}</span></div>
    </div>`;

    if(isNisab) {
      html += `<div class="alert success"><strong>Nisab reached.</strong> Your net wealth is above the minimum threshold.</div>
      <div class="total-row" style="margin-top:1rem;"><span class="total-label">Total Zakat Due (2.5%)</span><span class="total-val">$${zakatDue.toFixed(2)}</span></div>`;
    } else {
      html += `<div class="alert"><strong>Below Nisab.</strong> Your net wealth is below the minimum threshold. No Zakat is strictly due on this wealth.</div>
      <div class="total-row" style="margin-top:1rem; opacity:0.5;"><span class="total-label">Total Zakat Due</span><span class="total-val">$0.00</span></div>`;
    }
    c.innerHTML = html;
  }
}

// ==== TOOL: HAJJ/UMRAH TRACKER ====
function toggleHajj(id) {
  S_TRK[id] = !S_TRK[id];
  localStorage.setItem('hajjTracker', JSON.stringify(S_TRK));
  renderApp();
}
function renderHajj() {
  const c = document.getElementById('card');
  const items = TRK_DATA[step];
  let html = `<p class="step-title">${TRK_STEPS[step]}</p><p class="step-desc">Tap items to mark them as completed.</p><div style="margin-top:1rem;">`;
  
  items.forEach(item => {
    const chk = S_TRK[item.id];
    html += `
      <div class="check-item" onclick="toggleHajj('${item.id}')">
        <div class="check-box ${chk?'checked':''}">${chk?'✓':''}</div>
        <div class="check-label ${chk?'checked':''}">${item.t}</div>
      </div>
    `;
  });
  html += `</div>`;
  c.innerHTML = html;
}

// ==== TOOL: E-NUMBER CHECKER ====
function doESearch(val) { S_ENUM = val.trim().toUpperCase(); renderApp(); }
function renderENumber() {
  const c = document.getElementById('card');
  let resHtml = '';
  
  if (S_ENUM) {
    const eKey = S_ENUM.startsWith('E') ? S_ENUM : 'E'+S_ENUM;

      const pC = entry.status==='halal'?'status-halal':entry.status==='haram'?'status-haram':'status-mushbooh';
      resHtml = `<div style="margin-top:1rem; padding:1.25rem; border:1px solid var(--color-border-secondary); border-radius:var(--border-radius-md); background:var(--color-background-primary);">

        <span class="status-pill ${pC}">${entry.status.toUpperCase()}</span>
        <p style="font-size:14px; color:var(--color-text-secondary); margin-top:8px;">${entry.d}</p>
      </div>`;
    } else {
      resHtml = `<div style="margin-top:1rem; text-align:center; color:var(--color-text-tertiary); font-size:14px;">No data found for ${eKey}. Try E120 or E100.</div>`;
    }
  }

  c.innerHTML = `
    <p class="step-title">Food Additive Checker</p>
    <p class="step-desc">Enter an E-Number to check its Halal status.</p>
    <input type="text" class="search-box" placeholder="e.g., E120, 471" onkeyup="doESearch(this.value)" value="${S_ENUM}">
    ${resHtml}
    <div class="verse-note">Note: This is a sample database. Always verify with local certification bodies.</div>
  `;
}

// ==== TOOL: PRAYER TIMES & QIBLA ====
function getLoc() {
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
      pos => { S_LOC = {lat: pos.coords.latitude, lng: pos.coords.longitude, err: null}; renderApp(); },
      err => { S_LOC.err = "Location access denied. Cannot calculate times."; renderApp(); }
    );
  } else {
    S_LOC.err = "Geolocation not supported."; renderApp();
  }
}
function renderPrayer() {
  const c = document.getElementById('card');
  if (!S_LOC.lat && !S_LOC.err) {
    c.innerHTML = `<p class="step-title">Local Prayer Times</p><p class="step-desc">We need your location to calculate accurate times and Qibla direction.</p>
    <button class="choice-btn sel" style="width:100%; margin-top:1rem;" onclick="getLoc()">📍 Share Location</button>`;
    return;
  }
  
  if (S_LOC.err) {
    c.innerHTML = `<div class="alert">${S_LOC.err}</div><button class="choice-btn" style="margin-top:1rem" onclick="getLoc()">Try Again</button>`;
    return;
  }

  // Calculate adhan
  const coordinates = new adhan.Coordinates(S_LOC.lat, S_LOC.lng);
  const params = adhan.CalculationMethod.MuslimWorldLeague();
  const date = new Date();
  const pt = new adhan.PrayerTimes(coordinates, date, params);
  const qibla = adhan.Qibla(coordinates);
  
  const formatter = new Intl.DateTimeFormat('en-US', {hour:'numeric', minute:'2-digit', hour12:true});
  const current = pt.currentPrayer();
  
  const ps = ['fajr','sunrise','dhuhr','asr','maghrib','isha'];
  let pList = ps.map(p => `
    <div class="prayer-time ${current===p ? 'active':''}">
      <span style="text-transform:capitalize">${p}</span>
      <span>${formatter.format(pt[p])}</span>
    </div>
  `).join('');

  c.innerHTML = `
    <p class="step-title">Prayer Times</p>
    <p class="step-desc" style="margin-bottom:4px;">Calculated via Muslim World League</p>
    <div style="margin:1rem 0; border:0.5px solid var(--color-border-tertiary); border-radius:var(--border-radius-md); overflow:hidden;">
      ${pList}
    </div>
    
    <p class="step-title" style="margin-top:1.5rem">Qibla Direction</p>
    <div class="compass-wrap">
      <div class="compass-needle" style="transform: rotate(${qibla}deg)"></div>
      <div class="compass-center"></div>
    </div>
    <div class="qibla-text">${qibla.toFixed(1)}° from North</div>
  `;
}

renderApp();
