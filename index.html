<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Islamic Knowledge Hub</title>
<style>
:root {
  --font-sans: system-ui, -apple-system, sans-serif;
  --font-urdu: 'Jameel Noori Nastaleeq', 'Noto Nastaliq Urdu', 'Nafees Regular', Arial, sans-serif;
  --color-text-primary: #111827;
  --color-text-secondary: #4B5563;
  --color-text-tertiary: #9CA3AF;
  --color-background-primary: #ffffff;
  --color-background-secondary: #F3F4F6;
  --color-background-tertiary: #E5E7EB;
  --color-border-secondary: #D1D5DB;
  --color-border-tertiary: #E5E7EB;
  --border-radius-md: 8px;
  --border-radius-lg: 12px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans); background: #f9fafb; transition: all 0.2s;}

body.rtl { font-family: var(--font-urdu); direction: rtl; text-align: right; }
body.rtl .back-btn { left: auto; right: 0; }
body.rtl .lang-btn { right: auto; left: 0; }

.wrap{max-width:560px;margin:0 auto;padding:1.5rem 1rem; position: relative;}
.hdr{text-align:center;margin-bottom:1.5rem;position:relative;}
.back-btn{position:absolute;left:0;top:50%;transform:translateY(-50%);background:none;border:none;color:#1D9E75;font-size:14px;cursor:pointer;font-weight:500;display:none;font-family:inherit;}
.lang-btn{position:absolute;right:0;top:50%;transform:translateY(-50%);background:var(--color-background-secondary);border:1px solid var(--color-border-secondary);color:var(--color-text-primary);font-size:12px;padding:4px 10px;border-radius:16px;cursor:pointer;font-weight:600;font-family:inherit;}

.hdr h1{font-size:20px;font-weight:500;color:var(--color-text-primary)}
.hdr p{font-size:13px;color:var(--color-text-secondary);margin-top:4px}
.arabic{font-size:22px;color:var(--color-text-secondary);margin-bottom:6px;}

.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:1rem;}
.menu-card{background:var(--color-background-primary);border:1px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:1.5rem 1rem;text-align:center;cursor:pointer;transition:all 0.2s;}
.menu-card:hover{border-color:#1D9E75;box-shadow:0 4px 12px rgba(29,158,117,0.1);background:#F0FDF4;}
.menu-icon{font-size:28px;margin-bottom:8px;}
.menu-title{font-size:15px;font-weight:500;color:var(--color-text-primary);}

.prog{display:flex;gap:4px;margin-bottom:1.5rem}
.prog-item{flex:1;text-align:center}
.prog-bar{height:3px;border-radius:2px;margin-bottom:4px;background:var(--color-border-tertiary)}
.prog-bar.active{background:#1D9E75}

.card{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:1.25rem}
.row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:0.5px solid var(--color-border-tertiary)}
.row label{font-size:14px;color:var(--color-text-primary);flex:1;}

.val-input{width:120px;padding:8px 12px;border-radius:var(--border-radius-md);border:1px solid var(--color-border-secondary);font-size:15px;text-align:right;}
.choice-btn{padding:8px 16px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-secondary);background:var(--color-background-primary);cursor:pointer;margin:4px;}
.choice-btn.sel{border:1.5px solid #1D9E75;background:#E1F5EE;color:#085041}

.nav{display:flex;justify-content:space-between;margin-top:12px; gap:8px;}
.nav-btn{padding:10px 22px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-secondary);background:var(--color-background-primary);cursor:pointer;flex:1;font-weight:500;}
.nav-btn.prim{background:#1D9E75;color:white;border:none;}

.heir-row{display:flex;justify-content:space-between;padding:10px;background:var(--color-background-secondary);border-radius:6px;margin-bottom:6px;}
.tracker-card { border: 1px solid var(--color-border-secondary); padding: 1rem; border-radius: 8px; margin-bottom: 10px; cursor: pointer; display: flex; align-items: center; gap: 12px; }
.tracker-card.completed { background: #F0FDF4; border-color: #9FE1CB; }
</style>
</head>
<body>

<div class="wrap">
  <div class="hdr">
    <button id="btn-back" class="back-btn" onclick="openMenu()">← Back</button>
    <button id="btn-lang" class="lang-btn" onclick="toggleLang()">اردو</button>
    <div class="arabic">﷽</div>
    <h1 id="app-title">Islamic Knowledge Hub</h1>
    <p id="app-desc">Select a tool</p>
  </div>
  
  <div class="prog" id="prog" style="display:none"></div>
  <div class="card" id="card"></div>
  <div class="nav" id="nav" style="display:none"></div>
</div>

<script>
// ==== FRACTION ENGINE (FROM 700+ LINE VERSION) ====
const gcd=(a,b)=>b===0?a:gcd(b,a%b);
const F=(n,d)=>{if(n<=0||d<=0)return{n:0,d:1};const g=gcd(n,d);return{n:n/g,d:d/g}};
const fstr=f=>f.n===0?'0':(f.d===1?`${f.n}`:`${f.n}/${f.d}`);

// ==== i18n ====
const DICT = {
  en: {
    appTitle: "Islamic Knowledge Hub", menuInh: "Inheritance", menuZak: "Zakat", menuUmr: "Umrah Tracker",
    btnBack: "← Back", btnNext: "Next →", btnCalc: "Calculate →", btnStartOver: "↺ Start Over",
    zSteps: ['Assets', 'Nisab', 'Results'], zCash: "Cash & Bank", zGold: "Gold Value", zNisab: "Gold Price (per g)",
    iSteps: ['Gender', 'Spouse', 'Family', 'Results'], iHus: "Husband Alive", iWife: "Wife Alive", iSons: "Sons", iDaus: "Daughters"
  },
  ur: {
    appTitle: "مرکزِ علومِ اسلامیہ", menuInh: "وراثت", menuZak: "زکوٰۃ", menuUmr: "عمرہ ٹریکر",
    btnBack: "پیچھے", btnNext: "آگے", btnCalc: "حساب لگائیں", btnStartOver: "دوبارہ شروع کریں",
    zSteps: ['اثاثے', 'نصاب', 'نتائج'], zCash: "نقد رقم", zGold: "سونے کی مالیت", zNisab: "سونے کی قیمت",
    iSteps: ['جنس', 'شریک حیات', 'بچے', 'نتائج'], iHus: "شوہر زندہ ہے", iWife: "بیوی زندہ ہے", iSons: "بیٹے", iDaus: "بیٹیاں"
  }
};

let LANG = localStorage.getItem('appLang') || 'en';
const t = k => (DICT[LANG][k] || DICT['en'][k] || k);

// ==== STATE ====
let currentTool = 'menu', step = 0;
let S_ZAK = { cash: 0, gold: 0, goldPrice: 75 }; 
let S_INH = { gender: 'm', spouse: false, sons: 0, daus: 0 };

function toggleLang() {
  LANG = LANG === 'en' ? 'ur' : 'en';
  localStorage.setItem('appLang', LANG);
  renderApp();
}

function openMenu() { currentTool = 'menu'; step = 0; renderApp(); }

function renderApp() {
  document.body.className = LANG === 'ur' ? 'rtl' : '';
  document.getElementById('app-title').textContent = t('appTitle');
  document.getElementById('btn-lang').textContent = LANG === 'en' ? 'اردو' : 'English';
  document.getElementById('btn-back').style.display = currentTool === 'menu' ? 'none' : 'block';
  document.getElementById('btn-back').textContent = t('btnBack');

  const card = document.getElementById('card');
  if (currentTool === 'menu') {
    document.getElementById('prog').style.display = 'none';
    document.getElementById('nav').style.display = 'none';
    card.innerHTML = `
      <div class="menu-grid">
        <div class="menu-card" onclick="currentTool='inheritance';step=0;renderApp()"><div class="menu-icon">⚖️</div>${t('menuInh')}</div>
        <div class="menu-card" onclick="currentTool='zakat';step=0;renderApp()"><div class="menu-icon">💰</div>${t('menuZak')}</div>
        <div class="menu-card" onclick="currentTool='umrah';renderApp()"><div class="menu-icon">🕋</div>${t('menuUmr')}</div>
      </div>`;
  } else if (currentTool === 'zakat') renderZakat();
  else if (currentTool === 'inheritance') renderInh();
}

function renderZakat() {
  const steps = t('zSteps');
  renderProg(steps);
  let html = '';
  if (step === 0) {
    html = `<div class="row"><label>${t('zCash')}</label><input type="number" class="val-input" value="${S_ZAK.cash}" oninput="S_ZAK.cash=this.value"></div>
            <div class="row"><label>${t('zGold')}</label><input type="number" class="val-input" value="${S_ZAK.gold}" oninput="S_ZAK.gold=this.value"></div>`;
  } else if (step === 1) {
    html = `<div class="row"><label>${t('zNisab')}</label><input type="number" class="val-input" value="${S_ZAK.goldPrice}" oninput="S_ZAK.goldPrice=this.value"></div>`;
  } else {
    let total = parseFloat(S_ZAK.cash) + parseFloat(S_ZAK.gold);
    let nisabLimit = parseFloat(S_ZAK.goldPrice) * 87.48;
    let due = total >= nisabLimit ? total * 0.025 : 0;
    html = `<div class="heir-row"><span>Total</span><span>${total}</span></div>
            <div class="heir-row" style="background:${total >= nisabLimit ? '#E1F5EE' : '#FAEEDA'}">
              <span>${t('btnCalc')}</span><strong>${due.toFixed(2)}</strong>
            </div>`;
  }
  document.getElementById('card').innerHTML = html;
  renderNav(steps.length);
}

function renderInh() {
  const steps = t('iSteps');
  renderProg(steps);
  let html = '';
  if (step === 0) {
    html = `<button class="choice-btn ${S_INH.gender==='m'?'sel':''}" onclick="S_INH.gender='m';renderApp()">Male</button>
            <button class="choice-btn ${S_INH.gender==='f'?'sel':''}" onclick="S_INH.gender='f';renderApp()">Female</button>`;
  } else if (step === 1) {
    let label = S_INH.gender === 'm' ? t('iWife') : t('iHus');
    html = `<div class="row"><label>${label}</label><button class="choice-btn ${S_INH.spouse?'sel':''}" onclick="S_INH.spouse=!S_INH.spouse;renderApp()">Toggle</button></div>`;
  } else if (step === 2) {
    html = `<div class="row"><label>${t('iSons')}</label><input type="number" class="val-input" value="${S_INH.sons}" oninput="S_INH.sons=this.value"></div>
            <div class="row"><label>${t('iDaus')}</label><input type="number" class="val-input" value="${S_INH.daus}" oninput="S_INH.daus=this.value"></div>`;
  } else {
    // Basic fraction logic
    let share = S_INH.spouse ? (S_INH.sons+S_INH.daus > 0 ? '1/8' : '1/4') : 'Full to Residuary';
    html = `<div class="heir-row"><span>Spouse Share</span><span>${share}</span></div>`;
  }
  document.getElementById('card').innerHTML = html;
  renderNav(steps.length);
}

function renderProg(arr) {
  const p = document.getElementById('prog'); p.style.display = 'flex';
  p.innerHTML = arr.map((s,i)=>`<div class="prog-item"><div class="prog-bar ${i<=step?'active':''}"></div></div>`).join('');
}

function renderNav(max) {
  const n = document.getElementById('nav'); n.style.display = 'flex';
  const nTxt = step === max - 1 ? t('btnStartOver') : (step === max - 2 ? t('btnCalc') : t('btnNext'));
  n.innerHTML = `<button class="nav-btn" onclick="if(step>0){step--;renderApp()}">${t('btnBack')}</button>
                 <button class="nav-btn prim" onclick="if(step<${max-1}){step++;renderApp()}else{openMenu()}">${nTxt}</button>`;
}

openMenu();
</script>
</body>
</html>
